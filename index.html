<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 실험실 · 모둠</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="ico">🔭</span><div><b>스타 레인저 우주 실험실</b><small>모둠 측정값을 보내면 칠판 그래프에 바로 찍혀요</small></div></div>
  <span class="chip hidden" id="me"></span>
  <button class="btn ghost sm hidden" id="out" onclick="leave()">나가기</button>
</header>

<div class="wrap">
  <!-- 입장 -->
  <section class="card" id="v-join" style="max-width:560px;margin-left:auto;margin-right:auto">
    <h2>🚀 실험실 입장</h2>
    <p class="lead">모둠 대표 한 명이 입력해요.</p>
    <div class="row">
      <div><label for="inG">학년</label><input id="inG" type="number" inputmode="numeric" min="1" max="3" value="3"></div>
      <div><label for="inC">반</label><input id="inC" type="number" inputmode="numeric" min="1" max="9" placeholder="1~9"></div>
      <div><label for="inGrp">모둠</label><input id="inGrp" type="number" inputmode="numeric" min="1" max="10" placeholder="1~10"></div>
      <div><label for="inName">입력자</label><input id="inName" maxlength="10" placeholder="이름"></div>
    </div>
    <button class="btn wide" onclick="join()">입장하기</button>
  </section>

  <!-- 대기 -->
  <section class="card hidden" id="v-wait">
    <div class="big-wait"><span class="rocket">🛸</span>
      <h2>선생님이 실험을 시작할 때까지 대기 중…</h2>
      <p class="lead">시작되면 측정표가 자동으로 나타나요.</p></div>
  </section>

  <!-- 측정 -->
  <section class="card hidden" id="v-exp">
    <span class="tag" id="eStd"></span>
    <h2 id="eName" style="margin-top:6px"></h2>
    <p class="lead" id="eHow"></p>
    <p style="font-weight:800;color:var(--acc2)" id="eQ"></p>
    <table class="data"><thead><tr><th id="h0"></th><th id="hx"></th><th id="hy"></th></tr></thead><tbody id="tbody"></tbody></table>
    <button class="btn gold wide" id="send" onclick="send()">📡 칠판으로 보내기</button>
    <p class="msg" id="msg"></p>
    <div id="mineBox" class="hidden">
      <h3 style="margin-top:14px">우리 모둠 그래프</h3>
      <div id="mine"></div>
      <p class="lead">규칙을 찾아 <b>학습지</b>에 써 보세요. 반 전체 결과는 칠판 화면에서 함께 봐요.</p>
    </div>
  </section>
</div>
<div class="toast hidden" id="toast"></div>

<script src="common.js"></script>
<script>
  var me = null, st = null, timer = null;
  function show(id) { ['v-join', 'v-wait', 'v-exp'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); }); }

  var saved = store('labMe');
  if (saved) { $('inG').value = saved.g; $('inC').value = saved.c; $('inGrp').value = saved.grp; $('inName').value = saved.nm; me = saved; enter(); }

  function join() {
    var g = +$('inG').value, c = +$('inC').value, grp = +$('inGrp').value, nm = $('inName').value.trim();
    if (!(g >= 1 && g <= 3)) return toast('학년은 1~3');
    if (!(c >= 1 && c <= 9)) return toast('반은 1~9');
    if (!(grp >= 1 && grp <= 10)) return toast('모둠은 1~10');
    if (!nm) return toast('입력자 이름을 써 주세요');
    me = { g: g, c: c, grp: grp, nm: nm }; store('labMe', me); enter();
  }
  function enter() {
    $('me').textContent = me.g + '-' + me.c + ' · ' + me.grp + '모둠 · ' + me.nm;
    $('me').classList.remove('hidden'); $('out').classList.remove('hidden');
    show('v-wait'); poll();
  }
  function leave() { clearTimeout(timer); me = null; st = null; try { localStorage.removeItem('labMe'); } catch (e) {} $('me').classList.add('hidden'); $('out').classList.add('hidden'); show('v-join'); }

  function poll() {
    clearTimeout(timer); if (!me) return;
    apiGet({ api: 'labdata', grade: me.g, klass: me.c }).then(function (d) {
      var s = d.state;
      if (!s || !EXP[s.exp]) { st = null; show('v-wait'); }
      else {
        var isNew = !st || st.run !== s.run;
        st = s;
        if (isNew) build(EXP[s.exp], d.groups && d.groups[me.grp]);
        $('send').disabled = !s.open;
        if (!s.open) { $('msg').className = 'msg'; $('msg').textContent = '⏹ 선생님이 입력을 마감했어요.'; }
        show('v-exp');
      }
    }).catch(function () {}).finally(function () { timer = setTimeout(poll, 4000); });
  }

  function build(e, mine) {
    $('eStd').textContent = e.std; $('eName').textContent = e.icon + ' ' + e.name;
    $('eHow').textContent = e.how; $('eQ').textContent = '🤔 ' + e.q;
    $('h0').textContent = e.id === 'balloon' ? '은하' : '번'; $('hx').textContent = e.x + ' (' + e.xu + ')'; $('hy').textContent = e.y + ' (' + e.yu + ')';
    var tb = $('tbody'); tb.innerHTML = '';
    for (var i = 0; i < e.rows; i++) {
      var tr = document.createElement('tr');
      var p = mine && mine.pts[i];
      var x0 = p ? p[0] : (e.id === 'parallax' ? e.preset[i] : '');
      tr.innerHTML = '<td>' + (e.id === 'balloon' ? 'A→' + e.preset[i] : (i + 1)) + '</td>' +
        '<td><input type="number" step="any" inputmode="decimal" class="vx" value="' + x0 + '"></td>' +
        '<td><input type="number" step="any" inputmode="decimal" class="vy" value="' + (p ? p[1] : '') + '"></td>';
      tb.appendChild(tr);
    }
    $('msg').textContent = mine ? '이미 보낸 값이 있어요. 고쳐서 다시 보낼 수 있어요.' : '';
    $('msg').className = 'msg';
    if (mine) drawMine(e, mine.pts); else $('mineBox').classList.add('hidden');
  }

  function rows() {
    var xs = document.querySelectorAll('.vx'), ys = document.querySelectorAll('.vy'), pts = [];
    for (var i = 0; i < xs.length; i++) {
      if (xs[i].value === '' || ys[i].value === '') continue;
      pts.push([+xs[i].value, +ys[i].value]);
    }
    return pts;
  }

  function send() {
    if (!st) return;
    var e = EXP[st.exp], pts = rows();
    if (pts.length < 2) return toast('측정값을 두 줄 이상 채워 주세요');
    if (pts.some(function (p) { return p[0] <= 0 || p[1] < 0; })) return toast('거리는 0보다 커야 해요');
    if (e.id === 'balloon' && pts.some(function (p) { return p[1] < p[0]; })) return toast('나중 거리가 처음 거리보다 작은 줄이 있어요. 다시 확인!');
    $('send').disabled = true; $('msg').className = 'msg'; $('msg').textContent = '📡 보내는 중…';
    apiPost({ api: 'labsubmit', g: me.g, c: me.c, grp: me.grp, nm: me.nm, run: st.run, pts: pts }).then(function () {
      $('msg').className = 'msg ok'; $('msg').textContent = '✅ 칠판 그래프에 올라갔어요! 고칠 게 있으면 다시 보내도 돼요.';
      drawMine(e, pts);
    }).catch(function (err) { $('msg').className = 'msg no'; $('msg').textContent = err.message || '보내지 못했어요'; })
      .finally(function () { $('send').disabled = !st.open; });
  }

  function drawMine(e, pts) {
    $('mineBox').classList.remove('hidden');
    var show = e.id === 'balloon' ? pts.map(function (p) { return [p[0], +(p[1] - p[0]).toFixed(2)]; }) : pts;
    scatter($('mine'), [{ color: COLORS[(me.grp - 1) % 10], label: me.grp + '모둠', pts: show }],
      { h: 260, xl: e.x + ' (' + e.xu + ')', yl: e.id === 'balloon' ? '늘어난 거리 (cm)' : e.y + ' (' + e.yu + ')' });
  }
</script>
</body>
</html>
